<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Contact Me!</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
    <header>
        <h1>MIS 310</h1>
        <p class="name">Justin Le</p>
        <h2>Chess Website: Page 3</h2>
    </header>
    <main>
    <p id="Contact">Contact Us!</p>
    <form method="post" action="https://miswebapps.uncw.edu/mis310/form-submit.aspx">
     <label for="email">Email address</label>
    <input type="email" id="email" name="email" required>
    <br>
    <label for="FirstName">First Name (optional)</label>
    <input type="text" id="FirstName" name="FirstName">
    <label for="LastName">Last Name (optional)</label>
    <input type="text" id="LastName" name="LastName">
    <br>
    <fieldset>
        <legend>Reason for contact</legend>
    <p id="Contact">Reason for Contact?</p>
    <input type="radio" id="Bug-Report" name="Report" value="Bug-Report">
    <label for="Bug-Report">Bug Report</label>
    <br>
    <input type="radio" id="Question" name="Report" value="Question">
    <label for="Question">Question</label>
    <br>
    <input type="radio" id="Business-Opportunity" name="Report" value="Scammer">
    <label for="Business-Opportunity">Business Opportunity</label>
    <br>
    <input type="radio" id="Other" name="Report" value="Other">
    <label for="Other">Other</label>
    </fieldset>
    <br>
    <label for ="Message">Say your Message:</label>
    <br>
    <textarea id="Message" name="Message" maxlength="2000"
    style="height: 250px; width: 450px;"></textarea>
    <br>
      <p>
        <button>Submit</button>
      </p>

    </form>

    </main>

        <footer>
        <p class="foot"><a href="index.html">Home Page</a> </p>
        </footer>
    </body>
</html>
